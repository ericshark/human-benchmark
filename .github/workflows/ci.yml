name: HumanRank checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=critical
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run format:check
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.6
      - run: deno fmt --check supabase/functions
      - run: deno check --config supabase/functions/deno.json supabase/functions/humanrank/index.ts supabase/functions/aggregate/index.ts
      - run: npm run check
      - run: npx playwright install --with-deps
      - run: npm run test:e2e
        env:
          PW_HEADLESS: "true"
      - run: npm run test:production
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: browser-test-evidence
          path: test-results/
          retention-days: 7

  local-supabase:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb
        with:
          version: 3.0.0
      - name: Start disposable Supabase and apply migrations
        run: supabase start >/dev/null
      - name: Verify anonymous and per-player database access
        run: |
          db_url="$(supabase status -o json | python3 -c 'import json,sys; print(json.load(sys.stdin)["DB_URL"])')"
          psql "$db_url" -v ON_ERROR_STOP=1 -f supabase/tests/access-privacy.sql
      - name: Stop disposable Supabase
        if: always()
        run: supabase stop --no-backup
